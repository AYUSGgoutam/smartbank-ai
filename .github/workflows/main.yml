name: SmartBank AI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - GitHub Hosted Runner
  # =========================
  test:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall frontend database src

      - name: Run tests
        run: |
          pytest -q

  # =========================
  # CD - Deploy to EC2
  # =========================
  deploy:
    name: CD - Deploy to AWS EC2
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            cd /home/ubuntu/smartbank-ai

            echo "Pulling latest code..."
            git pull origin main

            echo "Activating virtual environment..."
            source /home/ubuntu/smartbank-ai/venv/bin/activate

            echo "Installing dependencies..."
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "Restarting SmartBank service..."
            sudo systemctl restart smartbank

            echo "Waiting for application..."
            sleep 10

            echo "Checking service..."
            sudo systemctl is-active --quiet smartbank

            echo "Checking Streamlit port..."
            curl -f http://127.0.0.1:8501/_stcore/health

            echo "Deployment successful!"
