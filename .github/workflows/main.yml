name: SmartBank AI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test SmartBank AI
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Python path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Check Python files
        run: |
          python -m compileall frontend database src

      - name: Run tests
        run: |
          pytest -q

  deploy:
    name: Deploy SmartBank AI
    needs: test
    runs-on: self-hosted

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Update application
        run: |
          cd ~/smartbank-ai

          git fetch origin main
          git reset --hard origin/main

      - name: Activate virtual environment
        run: |
          cd ~/smartbank-ai
          source venv/bin/activate
          python --version
          pip --version

      - name: Install dependencies
        run: |
          cd ~/smartbank-ai
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          cd ~/smartbank-ai
          source venv/bin/activate
          PYTHONPATH=. python -m compileall frontend database src

      - name: Restart SmartBank service
        run: |
          sudo systemctl restart smartbank

      - name: Check SmartBank service
        run: |
          sudo systemctl status smartbank --no-pager

      - name: Health check
        run: |
          sleep 5
          curl -f http://127.0.0.1:8501/_stcore/health
