services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/smartbank.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
  dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      SMARTBANK_API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
